<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plu's Sanctuary</title>
    <link rel="stylesheet" href="style.css">

    <!-- Preloads Ending Images-->
    <link rel="preload" href="assets/Panel 4/4A.png" as="image">
    <link rel="preload" href="assets/Panel 4/4B.png" as="image">

</head>
<body>

    <div class="story">

       <section class="p1 visible" id="p1"> <!-- Panel 1 Intro -->
            <img src="assets/Panel 1/titleBack.png" class="p1bg" >
            <img src="assets/Panel 1/Title.png" class="title">
            <img src="assets/Panel 1/titleFore.png" class="p1fg">
            
            <!--story navigation button-->
            <button class="nav-btn" onclick="nextPage()">Begin →</button>
        </section>


        <section class="p2" id="p2"> <!-- Panel 2 River -->
            <img src="assets/Panel 2/p2Back.png" class="riverbg">
            
            <img src="assets/Panel 2/p2ForeT.png" class="shore topShore">
            <img src="assets/Panel 2/p2ForeB.png" class="shore bottomShore">

            <img src="assets/Panel 2/p2Puzzle.png" class="surfaces">
            
            <img src="assets/Panel 2/pluLand.png" class="pluLand">

            <div class="surface-grid">
                <button class="b-btn b1" onclick="hopTo(1)"></button>
                <button class="b-btn b2" onclick="hopTo(2)"></button>
                <button class="b-btn b3" onclick="hopTo(3)"></button>
                <button class="b-btn b4" onclick="hopTo(4)"></button>
                <button class="b-btn b5" onclick="hopTo(5)"></button>
            </div>

            <button class="nav-btn hidden-nav" id="riverNav" onclick="nextPage()">Continue Journey →</button>
        </section>

        <section class="p3" id="p3"> <!-- Panel 3 Vine Fork -->
            <img src="assets/Panel 3/p3Back.png" class="forkBg">
        
            <img src="assets/Panel 3/p3Choice.png" class="sign">

            <img src="assets/Panel 3/p3Vine1.png" class="v1">
            <img src="assets/Panel 3/p3Vine2.png" class="v2">
            <img src="assets/Panel 3/p3Vine3.png" class="v3">

            <div class="vines">
                <button class="v-btn target1" onclick="clearVine(1)"></button>
                <button class="v-btn target2" onclick="clearVine(2)"></button>
                <button class="v-btn target3" onclick="clearVine(3)"></button>
            </div>

            <div class="sign-choices" id="choiceBox">
            <button class="choice-target left-sign" onclick="chooseEnding('left')"></button>
            <button class="choice-target right-sign" onclick="chooseEnding('right')"></button>
            </div>

            <img src="assets/Panel 3/p3Plu.png" class="pluFg">
        </section>

        <section class="p4" id="p4a"> <!-- Panel 4 Ending A -->
            <img src="assets/Panel 4A/4A.png" class="ending-img">
            <div class="ending-controls">
                <button class="end-btn" onclick="backToChoices('p4a')">Go back to choices</button>
                <button class="end-btn highlight-btn" onclick="restartStory()">Restart Story ↺</button>
            </div>
        </section>
    
         <section class="p4" id="p4b"> <!-- Panel 4 Ending B -->
            <img src="assets/Panel 4B/4B.png" class="ending-img">
            <div class="ending-controls">
                <button class="end-btn" onclick="backToChoices('p4b')">Go back to choices</button>
                <button class="end-btn highlight-btn" onclick="restartStory()">Restart Story ↺</button>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
