<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plu's Sanctuary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="intro"> <!-- Panel 1 -->
        <img src="assets/Panel 1/titleBack.png" class="p1bg" alt="Title Background">
        <img src="assets/Panel 1/Title.png" class="title" alt="Title Text">
        <img src="assets/Panel 1/titleFore.png" class="p1fg" alt="Title Foreground">   
    </section>

    <section class="river"> <!-- Panel 2 -->
        <img src="assets/Panel 2/p2Back.png" class="riverbg" alt="River Background">
        
        <img src="assets/Panel 2/p2ForeT.png" class="shore topShore" alt="Top Shore">
        <img src="assets/Panel 2/p2ForeB.png" class="shore bottomShore" alt="Bottom Shore">

        <img src="assets/Panel 2/p2Puzzle.png" class="surfaces" alt="Stepping Stones">
        
        <img src="assets/Panel 2/pluLand.png" class="pluLand" alt="Plu Character">

        <div class="surface-grid">
            <button class="b-btn b1" onclick="hopTo(1)"></button>
            <button class="b-btn b2" onclick="hopTo(2)"></button>
            <button class="b-btn b3" onclick="hopTo(3)"></button>
            <button class="b-btn b4" onclick="hopTo(4)"></button>
            <button class="b-btn b5" onclick="hopTo(5)"></button>
        </div>
    </section>

    <section class="vineFork"> <!-- Panel 3 -->
        <img src="assets/Panel 3/p3Back.png" class="forkBg">
       
        <img src="assets/Panel 3/p3Choice.png" class="sign">

        <img src="assets/Panel 3/p3Vine1.png" class="v1">
        <img src="assets/Panel 3/p3Vine2.png" class="v2">
        <img src="assets/Panel 3/p3Vine3.png" class="v3">

        <div class="vines">
            <button class="v-btn target1" onclick="clearVine(1)"></button>
            <button class="v-btn target2" onclick="clearVine(2)"></button>
            <button class="v-btn target3" onclick="clearVine(3)"></button>
        </div>

        <img src="assets/Panel 3/p3Plu.png" class="pluFg">
    </section>
  
    <script src="script.js"></script>
</body>
</html>
